name: Publish North Beach UV forecast

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run calculation tests
        run: python -m unittest discover -s tests -v
      - name: Fetch forecast and generate the pages
        run: python north_beach_uv.py --output-dir site
      - name: Save a copy for ChatGPT via GitHub connector
        run: |
          mkdir -p data
          cp site/uv-brief.txt data/uv-brief.txt
          cp site/uv-data.json data/uv-data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uv-brief.txt data/uv-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily North Beach UV forecast"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
